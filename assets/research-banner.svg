<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Bernadette Mathew — Computational Cancer Biology</title>
  <desc id="desc">A scientific network connects single cells to latent factors and interpretable biological programs.</desc>
  <defs>
